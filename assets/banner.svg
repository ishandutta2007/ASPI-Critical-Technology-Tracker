<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080c16"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accentLineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".2"/><stop offset="50%" stop-color="#60a5fa" stop-opacity=".9"/><stop offset="100%" stop-color="#ef4444" stop-opacity=".8"/></linearGradient><linearGradient id="chinaGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f97316"/></linearGradient><linearGradient id="usGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><radialGradient id="glowRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ef4444" stop-opacity=".35"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0"/></radialGradient><radialGradient id="glowBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseGlow{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:.7}}@keyframes waveFloat{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes nodeFlicker{0%{opacity:.8;r:5px}50%{opacity:1;r:7px}}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#f8fafc;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8}.tag-text{font-weight:600;font-size:13px;fill:#cbd5e1}.pulse-blue{transform-origin:200px 100px;animation:pulseGlow 6s ease-in-out infinite}.pulse-red{transform-origin:1000px 300px;animation:pulseGlow 5s ease-in-out infinite alternate}.animated-line-china{stroke-dasharray:8 6;animation:dashAnim 15s linear infinite}.animated-line-us{stroke-dasharray:6 6;animation:dashAnim 20s linear infinite reverse}.floating-pill{animation:waveFloat 4s ease-in-out infinite}.node-pulse{animation:nodeFlicker 3s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="220" cy="110" r="180" fill="url(#glowBlue)" class="pulse-blue"/><circle cx="1020" cy="290" r="220" fill="url(#glowRed)" class="pulse-red"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 120 320 C 350 310, 600 240, 850 170 C 980 140, 1100 130, 1140 120" class="animated-line-us"/><path fill="none" stroke="#ef4444" stroke-width="3" d="M 120 130 C 350 150, 600 230, 850 310 C 980 340, 1100 350, 1140 360" class="animated-line-china"/><circle cx="280" cy="315" r="5" fill="#38bdf8" class="node-pulse"/><circle cx="620" cy="235" r="5" fill="#a855f7" class="node-pulse"/><circle cx="950" cy="335" r="5" fill="#ef4444" class="node-pulse"/><circle cx="950" cy="148" r="5" fill="#38bdf8" class="node-pulse"/></g><g transform="translate(80, 75)"><g><rect width="220" height="30" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="15"/><circle cx="15" cy="15" r="4.5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="28" y="19" fill="#94a3b8" class="tag-text">ASPI RESEARCH DATASET</text></g><text x="0" y="80" class="title-text">Critical Technology Tracker</text><text x="0" y="122" class="subtitle-text">Tracking the Global Strategic Leadership Balance: <tspan fill="#38bdf8" font-weight="600">United States</tspan> vs <tspan fill="#ef4444" font-weight="600">China</tspan> (2007–2025)</text><rect width="1040" height="2" x="0" y="148" fill="url(#accentLineGrad)"/><g><g class="floating-pill" transform="translate(0, 175)"><rect width="180" height="42" x="0" y="0" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="20" cy="21" r="5" fill="#64748b"/><text x="36" y="26" class="tag-text">74 Technologies</text></g><g class="floating-pill" transform="translate(0, 175) translate(200, 0)"><rect width="185" height="42" x="0" y="0" fill="#1c1117" stroke="#7f1d1d" stroke-width="1.2" rx="10"/><circle cx="20" cy="21" r="5" fill="#ef4444"><animate attributeName="r" dur="2.5s" repeatCount="indefinite" values="4;6;4"/></circle><text x="36" y="26" fill="#fca5a5" class="tag-text">China Leads: 69 / 74</text></g><g class="floating-pill" transform="translate(0, 175) translate(405, 0)"><rect width="175" height="42" x="0" y="0" fill="#0c192e" stroke="#1e3a8a" stroke-width="1.2" rx="10"/><circle cx="20" cy="21" r="5" fill="#38bdf8"><animate attributeName="r" begin="1.2s" dur="2.5s" repeatCount="indefinite" values="4;6;4"/></circle><text x="36" y="26" fill="#93c5fd" class="tag-text">US Leads: 5 / 74</text></g><g class="floating-pill" transform="translate(0, 175) translate(600, 0)"><rect width="220" height="42" x="0" y="0" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" rx="10"/><circle cx="20" cy="21" r="5" fill="#eab308"/><text x="36" y="26" fill="#fef08a" class="tag-text">Python 3.8+ • Matplotlib</text></g><g class="floating-pill" transform="translate(0, 175) translate(840, 0)"><rect width="170" height="42" x="0" y="0" fill="#062419" stroke="#065f46" stroke-width="1.2" rx="10"/><circle cx="20" cy="21" r="5" fill="#10b981"/><text x="36" y="26" fill="#6ee7b7" class="tag-text">MIT Open Source</text></g></g></g></svg>