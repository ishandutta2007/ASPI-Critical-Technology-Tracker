<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chinaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="usGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }

      /* Dynamic pulse and movement */
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.7; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -400; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes nodeFlicker {
        0%, 100% { opacity: 0.8; r: 5px; }
        50% { opacity: 1; r: 7px; }
      }

      .pulse-blue {
        transform-origin: 200px 100px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .pulse-red {
        transform-origin: 1000px 300px;
        animation: pulseGlow 5s ease-in-out infinite alternate;
      }
      .animated-line-china {
        stroke-dasharray: 8 6;
        animation: dashAnim 15s linear infinite;
      }
      .animated-line-us {
        stroke-dasharray: 6 6;
        animation: dashAnim 20s linear infinite reverse;
      }
      .floating-pill {
        animation: waveFloat 4s ease-in-out infinite;
      }
      .node-pulse {
        animation: nodeFlicker 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulse-blue" cx="220" cy="110" r="180" fill="url(#glowBlue)" />
  <circle class="pulse-red" cx="1020" cy="290" r="220" fill="url(#glowRed)" />

  <!-- Animated Chart Trajectories in Background/Midground (Behind Text) -->
  <g opacity="0.45">
    <!-- US Trajectory (Declining Curve) -->
    <path class="animated-line-us" d="M 120 320 C 350 310, 600 240, 850 170 C 980 140, 1100 130, 1140 120" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- China Trajectory (Ascending Curve) -->
    <path class="animated-line-china" d="M 120 130 C 350 150, 600 230, 850 310 C 980 340, 1100 350, 1140 360" 
          fill="none" stroke="#ef4444" stroke-width="3" />

    <!-- Trajectory Data Nodes -->
    <circle class="node-pulse" cx="280" cy="315" r="5" fill="#38bdf8" />
    <circle class="node-pulse" cx="620" cy="235" r="5" fill="#a855f7" />
    <circle class="node-pulse" cx="950" cy="335" r="5" fill="#ef4444" />
    <circle class="node-pulse" cx="950" cy="148" r="5" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Header, Badges, Pills (Completely clear & unoccluded) -->
  <g transform="translate(80, 75)">
    <!-- Category Tag / Top Badge -->
    <g>
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="15" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="tag-text" fill="#94a3b8">ASPI RESEARCH DATASET</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Critical Technology Tracker
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle-text">
      Tracking the Global Strategic Leadership Balance: <tspan fill="#38bdf8" font-weight="600">United States</tspan> vs <tspan fill="#ef4444" font-weight="600">China</tspan> (2007–2025)
    </text>

    <!-- Decorative Gradient Separator -->
    <rect x="0" y="148" width="1040" height="2" fill="url(#accentLineGrad)" />

    <!-- Interactive / Dynamic Status Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1: Total Techs -->
      <g class="floating-pill">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#64748b" />
        <text x="36" y="26" class="tag-text">74 Technologies</text>
      </g>

      <!-- Pill 2: China Leads -->
      <g class="floating-pill" transform="translate(200, 0)">
        <rect x="0" y="0" width="185" height="42" rx="10" fill="#1c1117" stroke="#7f1d1d" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#ef4444">
          <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <text x="36" y="26" class="tag-text" fill="#fca5a5">China Leads: 69 / 74</text>
      </g>

      <!-- Pill 3: US Leads -->
      <g class="floating-pill" transform="translate(405, 0)">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0c192e" stroke="#1e3a8a" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#38bdf8">
          <animate attributeName="r" values="4;6;4" dur="2.5s" begin="1.2s" repeatCount="indefinite" />
        </circle>
        <text x="36" y="26" class="tag-text" fill="#93c5fd">US Leads: 5 / 74</text>
      </g>

      <!-- Pill 4: Python Matplotlib Visualization -->
      <g class="floating-pill" transform="translate(600, 0)">
        <rect x="0" y="0" width="220" height="42" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#eab308" />
        <text x="36" y="26" class="tag-text" fill="#fef08a">Python 3.8+ • Matplotlib</text>
      </g>

      <!-- Pill 5: Open Source -->
      <g class="floating-pill" transform="translate(840, 0)">
        <rect x="0" y="0" width="170" height="42" rx="10" fill="#062419" stroke="#065f46" stroke-width="1.2" />
        <circle cx="20" cy="21" r="5" fill="#10b981" />
        <text x="36" y="26" class="tag-text" fill="#6ee7b7">MIT Open Source</text>
      </g>
    </g>
  </g>
</svg>
